<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Rule Builder</title>

<style>

:root{
  --bg:#000;
  --panel:#303030;
  --line:#000;
  --text:#f0f0f0;

  --green:#2f8f2f;
  --orange:#8a5a1f;
  --red:#6b2020;
}

*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:var(--bg);
  color:var(--text);

  font-family:Consolas,"Courier New",monospace;
  font-size:28px;
  text-transform:uppercase;
}

.app{
  max-width:1500px;
  margin:30px auto;
  border:3px solid var(--line);
}

.rule-row{
  display:grid;
  grid-template-columns:25% 25% 35% 15%;
}

.cell{
  min-height:86px;

  display:flex;
  align-items:center;

  background:var(--panel);

  border-right:3px solid var(--line);
  border-bottom:3px solid var(--line);

  padding:10px 20px;
}

.cell:last-child{
  border-right:0;
}

.action{
  justify-content:flex-start;
}

.parameter{
  justify-content:flex-end;
}

.value{
  justify-content:flex-start;
}

.button{
  justify-content:flex-end;
  text-align:right;
}

select,
input,
button{
  width:100%;
  height:100%;

  background:transparent;
  border:0;
  outline:none;

  color:var(--text);

  font:inherit;
  text-transform:uppercase;
}

select{
  cursor:pointer;

  appearance:none;
  -webkit-appearance:none;
  -moz-appearance:none;

  background-image:none;
}

select option{
  background:#222;
  color:#fff;
}

.parameter select{
  text-align:right;
  text-align-last:right;
}

input{
  text-align:left;
}

input::placeholder{
  color:#888;
}

button{
  cursor:pointer;
}

.button button{
  display:flex;
  justify-content:flex-end;
  align-items:center;
  text-align:right;
}

button:hover{
  background:#444;
}

.creator .action{
  background:var(--green);
}

.rule.extend .action{
  background:var(--green);
}

.rule.constrain .action{
  background:var(--orange);
}

.rule.omit .action{
  background:var(--red);
}

.add{
  background:#1d5f1d;
}

.remove{
  background:#4b1b1b;
}

.remove:hover{
  background:#6b2020;
}

.empty{
  min-height:86px;

  display:flex;
  align-items:center;
  justify-content:center;

  background:#222;

  border-bottom:3px solid var(--line);

  color:#777;
}

.json-title{
  min-height:70px;

  display:flex;
  align-items:center;
  justify-content:center;

  background:#333;

  border-bottom:3px solid var(--line);
}

pre{
  margin:0;
  padding:24px;

  background:#111;
  color:#8cff80;

  font-size:16px;
  line-height:1.5;

  white-space:pre-wrap;
}

@media(max-width:900px){

  body{
    font-size:18px;
  }

  .rule-row{
    grid-template-columns:1fr 1fr 1fr 1fr;
  }

  .cell{
    min-height:72px;
    padding:8px;
  }

}

</style>
</head>

<body>

<div class="app">

  <div class="rule-row creator">

    <div class="cell action">
      <select id="action">
        <option value="extend">EXTEND</option>
        <option value="constrain">CONSTRAIN</option>
        <option value="omit">OMIT</option>
      </select>
    </div>

    <div class="cell parameter">
      <select id="parameter">
        <option value="years">YEARS</option>
        <option value="flag">FLAG</option>
        <option value="event_code">EVENT CODE</option>
        <option value="status">STATUS</option>
      </select>
    </div>

    <div class="cell value">
      <input
        id="value"
        placeholder="VALUE"
        autocomplete="off">
    </div>

    <div class="cell button add">
      <button type="button" onclick="addRule()">
        ADD
      </button>
    </div>

  </div>

  <div id="rules"></div>

  <div class="json-title">
    JSON EXPORT
  </div>

  <pre id="json"></pre>

</div>

<script>

let rules = [];

function addRule(){

  const action =
    document.getElementById("action").value;

  const parameter =
    document.getElementById("parameter").value;

  const value =
    document.getElementById("value").value.trim();

  if(!value) return;

  rules.push({
    action,
    parameter,
    value
  });

  document.getElementById("value").value = "";

  render();
}

function removeRule(index){

  rules.splice(index,1);

  render();
}

function render(){

  const root =
    document.getElementById("rules");

  root.innerHTML = "";

  if(rules.length === 0){

    root.innerHTML = `
      <div class="empty">
        NO RULES
      </div>
    `;
  }

  rules.forEach((rule,index)=>{

    const row =
      document.createElement("div");

    row.className =
      "rule-row rule " + rule.action;

    row.innerHTML =

      '<div class="cell action">' +
        escapeHtml(rule.action) +
      '</div>' +

      '<div class="cell parameter">' +
        escapeHtml(rule.parameter) +
      '</div>' +

      '<div class="cell value">' +
        escapeHtml(rule.value) +
      '</div>' +

      '<div class="cell button remove">' +
        '<button type="button" onclick="removeRule(' + index + ')">' +
          'REMOVE' +
        '</button>' +
      '</div>';

    root.appendChild(row);

  });

  document.getElementById("json").textContent =
    JSON.stringify(rules,null,2);
}

function escapeHtml(value){

  return String(value)

    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

document
.getElementById("value")
.addEventListener("keydown",event=>{

  if(event.key === "Enter"){
    addRule();
  }

});

render();

</script>

</body>
</html>
