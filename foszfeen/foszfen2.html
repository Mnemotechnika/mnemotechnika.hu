<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8" />
<title>Foszfén – felhős / zajos verzió</title>
<style>
  body {
    margin: 0;
    background: black;
    overflow: hidden;
  }
  canvas {
    display: block;
    opacity: 0.5;
  }
</style>
</head>
<body>
<canvas id="phosphene-cloud"></canvas>

<script>
const canvas = document.getElementById("phosphene-cloud");
const ctx = canvas.getContext("2d");

// Képernyőméret
function resize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
window.addEventListener("resize", resize);
resize();

// Belső, alacsonyabb felbontású "zaj-canvas", erre számolunk
const off = document.createElement("canvas");
const offCtx = off.getContext("2d");

// kis felbontás: így gyorsabb a per-pixel számolás
function resizeOffscreen() {
  const base = 220;
  const aspect = canvas.height / canvas.width;
  off.width = base;
  off.height = Math.round(base * aspect);
}
resizeOffscreen();
window.addEventListener("resize", resizeOffscreen);

let start = performance.now();

// egyszerű pseudo-random, hogy ne legyen teljesen “statikus”
function hash2d(x, y) {
  const s = Math.sin(x * 127.1 + y * 311.7) * 43758.5453;
  return s - Math.floor(s);
}

function renderNoiseField(time) {
  const t = (time - start) * 0.0005; // globális idő

  const w = off.width;
  const h = off.height;
  const imageData = offCtx.createImageData(w, h);
  const data = imageData.data;

  const cx = w / 2;
  const cy = h / 2;
  const maxR = Math.min(w, h) * 1.2;

  for (let y = 0; y < h; y++) {
    for (let x = 0; x < w; x++) {
      const i = (y * w + x) * 4;

      // normalizált koordináták középponttól
      const dx = x - cx;
      const dy = y - cy;
      const r = Math.sqrt(dx * dx + dy * dy);

      // körön kívül sötétítünk
      if (r > maxR) {
        data[i] = data[i+1] = data[i+2] = 0;
        data[i+3] = 255;
        continue;
      }

      const nr = r / maxR;

      const nx = dx / maxR;
      const ny = dy / maxR;

      // Több rétegű “soft” zaj (sin + hash kombó)
      let v = 0;

      // 1. “lassú hullám”
      v += Math.sin((nx * 3.2 + ny * 2.7) + t * 1.3);
      // 2. “kisebb skálájú” hullám
      v += 0.6 * Math.sin((nx * 8.0 - ny * 6.3) - t * 2.1);
      // 3. hash alapú zizegés
      v += 0.5 * (hash2d(x * 0.8 + t * 40, y * 0.8 - t * 30) * 2 - 1);

      // radiális gyűrű-jelleg néha belekeverve (foszfenhez hasonlít)
      v += 0.6 * Math.sin(nr * 18.0 - t * 3.0);

      // normálás – nagyjából -3..3 → 0..1
      let n = (v + 3.0) / 6.0;
      if (n < 0) n = 0;
      if (n > 1) n = 1;

      // középen fényesebb, szélek felé sötétebb
      const radialFade = 1.0 - nr * nr * 0.9;
      n *= radialFade;

      // Hue lassan körbefordul, lokálisan is kicsit variálódik
      const baseHue = (t * 120 + nr * 200) % 360;
      const hue = baseHue + (n - 0.5) * 60;

      const sat = 70 + n * 30;      // 70–100%
      const light = 15 + n * 65;    // 15–80%

      // HSL → RGB konverzió
      function hslToRgb(h, s, l) {
        h = (h % 360 + 360) % 360;
        s /= 100;
        l /= 100;

        const c = (1 - Math.abs(2 * l - 1)) * s;
        const hp = h / 60;
        const x2 = c * (1 - Math.abs((hp % 2) - 1));

        let r1, g1, b1;
        if (hp >= 0 && hp < 1) { r1 = c; g1 = x2; b1 = 0; }
        else if (hp >= 1 && hp < 2) { r1 = x2; g1 = c; b1 = 0; }
        else if (hp >= 2 && hp < 3) { r1 = 0; g1 = c; b1 = x2; }
        else if (hp >= 3 && hp < 4) { r1 = 0; g1 = x2; b1 = c; }
        else if (hp >= 4 && hp < 5) { r1 = x2; g1 = 0; b1 = c; }
        else { r1 = c; g1 = 0; b1 = x2; }

        const m = l - c / 2;
        return {
          r: Math.round((r1 + m) * 255),
          g: Math.round((g1 + m) * 255),
          b: Math.round((b1 + m) * 255)
        };
      }

      const rgb = hslToRgb(hue, sat, light);

      // enyhe random "szemcsésítés"
      const grain = (hash2d(x + t * 100, y - t * 80) - 0.5) * 1;
      data[i]   = Math.max(0, Math.min(255, rgb.r + grain));
      data[i+1] = Math.max(0, Math.min(255, rgb.g + grain));
      data[i+2] = Math.max(0, Math.min(255, rgb.b + grain));
      data[i+3] = 255;
    }
  }

  offCtx.putImageData(imageData, 0, 0);
}

function draw(time) {
  renderNoiseField(time);

  // fő canvas törlése enyhe “utánhúzó” feketítéssel
  ctx.globalCompositeOperation = "source-over";
  ctx.globalAlpha = 1.0;
  ctx.fillStyle = "black";
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // zaj-textúra rárajzolása, teljes képernyőre skálázva
  ctx.globalAlpha = 1.0;
  ctx.globalCompositeOperation = "lighter";
  ctx.drawImage(
    off,
    0, 0, off.width, off.height,
    0, 0, canvas.width, canvas.height
  );

  requestAnimationFrame(draw);
}

requestAnimationFrame(draw);
</script>
</body>
</html>
