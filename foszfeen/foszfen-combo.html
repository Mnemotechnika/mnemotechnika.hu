<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8" />
<title>Foszfén – kombinált (felhő + gyűrűk, optimalizált)</title>
<style>
  body {
    margin: 0;
    background: black;
    overflow: hidden;
  }
  canvas {
    display: block;
  }
</style>
</head>
<body>
<canvas id="phosphene"></canvas>

<script>
const canvas = document.getElementById("phosphene");
const ctx = canvas.getContext("2d");

// Offscreen canvas a felhős/zajos háttérhez
const off = document.createElement("canvas");
const offCtx = off.getContext("2d");

// alapfelbontás a zaj-canvashez (minél kisebb, annál gyorsabb)
const OFF_BASE = 180;

// zaj ImageData – FONTOS: már itt deklaráljuk, mielőtt bármely függvény használná
let noiseImageData = null;

function resizeOffscreen() {
  const aspect = canvas.height / canvas.width;
  off.width = OFF_BASE;
  off.height = Math.round(OFF_BASE * aspect);
  noiseImageData = null; // méret változott, új ImageData kell majd
}

function resize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  resizeOffscreen();
}

window.addEventListener("resize", resize);
resize();

// Konstansok
const RINGS = 40;
const NOISE_STRENGTH = 0.12;
let startTime = performance.now();

// frame-számláló (ritkábban számoljuk a zajt)
let frame = 0;

// Pseudo-random / hash
function rnd(seed) {
  return Math.sin(seed * 127.1) * 43758.5453 % 1;
}

function hash2d(x, y) {
  const s = Math.sin(x * 127.1 + y * 311.7) * 43758.5453;
  return s - Math.floor(s);
}

// HSL → RGB konverzió
function hslToRgb(h, s, l) {
  h = (h % 360 + 360) % 360;
  s /= 100;
  l /= 100;

  const c = (1 - Math.abs(2 * l - 1)) * s;
  const hp = h / 60;
  const x2 = c * (1 - Math.abs((hp % 2) - 1));

  let r1, g1, b1;
  if (hp >= 0 && hp < 1) { r1 = c; g1 = x2; b1 = 0; }
  else if (hp >= 1 && hp < 2) { r1 = x2; g1 = c; b1 = 0; }
  else if (hp >= 2 && hp < 3) { r1 = 0; g1 = c; b1 = x2; }
  else if (hp >= 3 && hp < 4) { r1 = 0; g1 = x2; b1 = c; }
  else if (hp >= 4 && hp < 5) { r1 = x2; g1 = 0; b1 = c; }
  else { r1 = c; g1 = 0; b1 = x2; }

  const m = l - c / 2;
  return {
    r: Math.round((r1 + m) * 255),
    g: Math.round((g1 + m) * 255),
    b: Math.round((b1 + m) * 255)
  };
}

// === FELHŐS / ZAJOS HÁTTÉR ===
function renderNoiseField(time) {
  const t = (time - startTime) * 0.0008;

  const w = off.width;
  const h = off.height;

  if (!noiseImageData || noiseImageData.width !== w || noiseImageData.height !== h) {
    noiseImageData = offCtx.createImageData(w, h);
  }

  const data = noiseImageData.data;

  const cx = w / 2;
  const cy = h / 2;
  const maxR = Math.min(w, h) * 0.55;

  for (let y = 0; y < h; y++) {
    for (let x = 0; x < w; x++) {
      const i = (y * w + x) * 4;
      const dx = x - cx;
      const dy = y - cy;
      const r = Math.sqrt(dx * dx + dy * dy);

      if (r > maxR) {
        data[i] = data[i+1] = data[i+2] = 0;
        data[i+3] = 255;
        continue;
      }

      const nr = r / maxR;
      const nx = dx / maxR;
      const ny = dy / maxR;

      let v = 0;
      v += Math.sin((nx * 3.2 + ny * 2.7) + t * 1.3);
      v += 0.6 * Math.sin((nx * 8.0 - ny * 6.3) - t * 2.1);
      v += 0.5 * (hash2d(x * 0.8 + t * 40, y * 0.8 - t * 30) * 2 - 1);
      v += 0.6 * Math.sin(nr * 18.0 - t * 3.0);

      let n = (v + 3.0) / 6.0;
      if (n < 0) n = 0;
      if (n > 1) n = 1;

      const radialFade = 1.0 - nr * nr * 0.9;
      n *= radialFade;

      const baseHue = (t * 120 + nr * 200) % 360;
      const hue = baseHue + (n - 0.5) * 60;
      const sat = 70 + n * 30;
      const light = 15 + n * 65;

      const rgb = hslToRgb(hue, sat, light);
      const grain = (hash2d(x + t * 100, y - t * 80) - 0.5) * 30;

      data[i]   = Math.max(0, Math.min(255, rgb.r + grain));
      data[i+1] = Math.max(0, Math.min(255, rgb.g + grain));
      data[i+2] = Math.max(0, Math.min(255, rgb.b + grain));
      data[i+3] = 255;
    }
  }
  offCtx.putImageData(noiseImageData, 0, 0);
}

function renderCloud(time) {
  // csak minden 2. frame-ben újraszámoljuk a zajt (könnyebb a CPU-nak)
  if (frame % 2 === 0) {
    renderNoiseField(time);
  }

  // enyhe utánhúzás a fő canvas-on
  ctx.globalCompositeOperation = "source-over";
  ctx.globalAlpha = 0.3;
  ctx.fillStyle = "black";
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // zaj-textúra felrajzolása
  ctx.globalAlpha = 1.0;
  ctx.globalCompositeOperation = "lighter";
  ctx.drawImage(
    off,
    0, 0, off.width, off.height,
    0, 0, canvas.width, canvas.height
  );
}

// === GYŰRŰS FOSZFÉN ELŐTÉR ===
function renderRings(time) {
  const t = (time - startTime) * 0.001;

  const w = canvas.width;
  const h = canvas.height;
  const cx = w / 2;
  const cy = h / 2;
  const maxRadius = Math.min(w, h) * 0.6;

  ctx.globalCompositeOperation = "lighter";

  const breathing = 0.08 * Math.sin(t * 1.2);

  for (let i = 0; i < RINGS; i++) {
    const f = i / (RINGS - 1);

    let radius = f * maxRadius;
    const localPulse = 0.18 * Math.sin(t * 2.2 + f * 8.0);
    radius *= 1.0 + breathing + localPulse * 0.1;

    const noisePhase = t * 0.8 + f * 10.0;
    const jitter = NOISE_STRENGTH * (rnd(noisePhase) - 0.5);
    radius *= 1.0 + jitter;

    const band = Math.sin(f * Math.PI * 4.0 + t * 1.5);
    const intensity = Math.max(0, band);
    if (intensity < 0.02) continue;

    const alpha = 0.04 + intensity * 0.18;

    const hueBase = (t * 12 + f * 240) % 360;
    const hue = (hueBase + band * 40) % 360;
    const sat = 80 + intensity * 20;
    const light = 35 + intensity * 35;

    ctx.save();
    ctx.translate(cx, cy);
    const globalRot = t * 0.05;
    ctx.rotate(globalRot);

    ctx.lineWidth = maxRadius * 0.02 + f * maxRadius * 0.03;
    ctx.strokeStyle = `hsla(${hue}, ${sat}%, ${light}%, ${alpha})`;

    ctx.shadowBlur = 30 + intensity * 40;
    ctx.shadowColor = `hsla(${hue}, ${sat}%, ${light + 10}%, ${alpha})`;

    ctx.beginPath();
    ctx.arc(0, 0, radius, 0, Math.PI * 2);
    ctx.stroke();
    ctx.restore();
  }

  // kis szikrák középen
  for (let i = 0; i < 20; i++) {
    const angle = Math.random() * Math.PI * 2;
    const r = Math.random() * maxRadius * 0.25;
    const x = cx + Math.cos(angle) * r;
    const y = cy + Math.sin(angle) * r;
    const sparkHue = (t * 40 + r * 5) % 360;

    ctx.globalAlpha = 0.1;
    ctx.fillStyle = `hsla(${sparkHue}, 90%, 70%, 0.8)`;
    ctx.beginPath();
    ctx.arc(x, y, 1.5 + Math.random() * 2.5, 0, Math.PI * 2);
    ctx.fill();
  }
}

// === FŐ LOOP ===
function draw(time) {
  frame++;
  renderCloud(time);  // háttér
  renderRings(time);  // előtér

  requestAnimationFrame(draw);
}

requestAnimationFrame(draw);
</script>
</body>
</html>
