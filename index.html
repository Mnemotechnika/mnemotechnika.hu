<!doctype html>
<html lang="hu">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
	<title>Mnemotechnika</title>
	<meta name="theme-color" content="#000000">
	<meta name="mobile-web-app-capable" content="yes">
	<meta name="apple-mobile-web-app-capable" content="yes">
	<meta name="apple-mobile-web-app-status-bar-style" content="black">
	<meta name="apple-mobile-web-app-title" content="Mnemotechnika">
	<link rel="icon" type="image/svg+xml" id="favicon">
	<style>
		html, body {
			margin: 0;
			height: 100%;
			background: #000;
			overflow: hidden;
		}
		#logo {
			display: none;
		}
		#scene {
			position: fixed;
			overflow: hidden;
		}
		#stack, #stack div {
			position: absolute;
			top: 0;
			left: 0;
			width: 100%;
			height: 100%;
			-webkit-transform-style: preserve-3d;
			transform-style: preserve-3d;
		}
		#stack div {
			background-repeat: no-repeat;
			background-position: center;
		}
	</style>
</head>
<body>
	<svg id="logo" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 13 14" width="1300" height="1400">
		<path fill="#e99022" d="M0,1 h2 v5 h6 v2 h-6 v5 h-2 z
		                        M3,0 h1 v4 h6 v6 h-6 v4 h-1 v-5 h6 v-4 h-6 z
		                        M5,1 h8 v12 h-8 v-2 h6 v-8 h-6 z"/>
	</svg>

	<div id="scene">
		<div id="stack"></div>
	</div>

	<script>
		var CONFIG = {
			layers: 10,
			spacing: 200,
			perspective: 3000,
			frontOpacity: 0.5,
			backOpacity: 0.05,
			size: 77.875,
			extent: 140,
			color: '#e99022',
			sensitivity: 1,
			friction: 0.1,
			tiltBoost: 2,
			tiltDivisor: 30
		};

		var logo = document.getElementById('logo');
		logo.querySelector('path').setAttribute('fill', CONFIG.color);
		var image = 'data:image/svg+xml,' + encodeURIComponent(new XMLSerializer().serializeToString(logo));
		document.getElementById('favicon').href = image;

		var scene = document.getElementById('scene');
		scene.style.left = scene.style.top = (100 - CONFIG.extent) / 2 + '%';
		scene.style.width = scene.style.height = CONFIG.extent + '%';
		scene.style.webkitPerspective = scene.style.perspective = CONFIG.perspective + 'px';

		var stack = document.getElementById('stack');
		var layers = [];
		for (var i = 0; i < CONFIG.layers; i++) {
			var layer = document.createElement('div');
			var depth = i / Math.max(CONFIG.layers - 1, 1);
			layer.style.backgroundImage = 'url("' + image + '")';
			layer.style.webkitTransform = layer.style.transform = 'translateZ(' + -i * CONFIG.spacing + 'px)';
			layer.style.opacity = CONFIG.frontOpacity + (CONFIG.backOpacity - CONFIG.frontOpacity) * depth;
			stack.appendChild(layer);
			layers.push(layer);
		}

		function resize() {
			var height = Math.min(innerWidth, innerHeight) * CONFIG.extent / 100 * CONFIG.size / 100;
			for (var i = 0; i < layers.length; i++) {
				layers[i].style.backgroundSize = height * 13 / 14 + 'px ' + height + 'px';
			}
		}
		resize();
		addEventListener('resize', resize);

		var state = { x: 0, y: 0, vx: 0, vy: 0, mode: null, portrait: null, base: null, lastTouch: 0, lastMouse: null };

		addEventListener('touchstart', function () {
			state.lastTouch = Date.now();
		});

		addEventListener('mousemove', function (event) {
			var last = state.lastMouse;
			state.lastMouse = [event.clientX, event.clientY];
			if (!last || (last[0] === event.clientX && last[1] === event.clientY)) return;
			if (Date.now() - state.lastTouch < 1000) return;
			state.mode = 'mouse';
			state.x = event.clientX / innerWidth * 2 - 1;
			state.y = event.clientY / innerHeight * 2 - 1;
		});

		addEventListener('deviceorientation', function (event) {
			if (state.mode === 'mouse' || event.beta == null || event.gamma == null) return;
			state.mode = 'tilt';
			var beta = event.beta / CONFIG.tiltDivisor;
			var gamma = event.gamma / CONFIG.tiltDivisor;
			var portrait = innerHeight > innerWidth;
			if (portrait !== state.portrait || !state.base) {
				state.portrait = portrait;
				state.base = { beta: beta, gamma: gamma };
			}
			state.x = portrait ? gamma : beta;
			state.y = portrait ? beta - state.base.beta : gamma - state.base.gamma;
		});
		setTimeout(function () {
			state.base = null;
		}, 500);

		if (window.DeviceOrientationEvent && DeviceOrientationEvent.requestPermission) {
			addEventListener('touchend', function ask() {
				removeEventListener('touchend', ask);
				DeviceOrientationEvent.requestPermission();
			});
		}

		var requestFrame = window.requestAnimationFrame || window.webkitRequestAnimationFrame || function (callback) {
			setTimeout(callback, 16);
		};

		function frame() {
			var scale = CONFIG.extent / 100 * CONFIG.sensitivity / 100;
			state.vx += (state.x * innerWidth * scale - state.vx) * CONFIG.friction;
			state.vy += (state.y * innerHeight * scale - state.vy) * CONFIG.friction;
			var angle = Math.sqrt(state.vx * state.vx + state.vy * state.vy);
			var rotation = state.mode === 'tilt'
				? 'rotate3d(' + state.vy + ', ' + -state.vx + ', 0, ' + angle * CONFIG.tiltBoost + 'deg)'
				: 'rotate3d(' + -state.vy + ', ' + state.vx + ', 0, ' + angle + 'deg)';
			stack.style.webkitTransform = stack.style.transform = rotation;
			requestFrame(frame);
		}
		frame();
	</script>
</body>
</html>
